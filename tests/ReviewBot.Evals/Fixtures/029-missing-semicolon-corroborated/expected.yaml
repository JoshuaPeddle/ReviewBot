must_flag:
  - path: src/Demo/Counter.cs
    line_range: [7, 8]
    severity_at_least: error
    topic: syntax_error
    must_be_verified: true
    # Range spans 7-8 on purpose: a missing terminator is reported at the end of line 7,
    # but a reviewer may equally point at line 8 as the place the parser gave up.
    must_mention_any:
      - semicolon
      - terminat
      - syntax
      - compile
      - compilation
      - expected
max_total_comments: 3
expected_review_state: REQUEST_CHANGES
