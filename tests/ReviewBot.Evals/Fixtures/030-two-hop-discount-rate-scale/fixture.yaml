name: Express the checkout discount as a percentage
category: cross_file_body
difficulty: high
description: |
  CheckoutHandler.Checkout converts the promo rate before applying it.
notes: |
  Scale + two-hop retrieval fixture.

  Every other repo-state in this corpus is at most 50 files, so retrieval and chunk
  planning are never load-bearing: the answer is always already in the prompt. This one
  is ~290 files of deliberately similar shape (Domain/Repository/Service/Handler per
  domain name), so the reviewer has to locate the two files that matter rather than
  receive them for free.

  The defect needs two hops out of the diff:
    CheckoutHandler (diff) -> OrderService.ApplyDiscount -> DiscountRepository.GetRate
  GetRate returns a fraction (0.15 == 15% off) and ApplyDiscount documents its parameter
  as the same fraction. The diff multiplies by 100 before passing it, discounting 1500%
  and returning a large negative total. Nothing in the diff itself is wrong-looking —
  converting a rate to a percentage is ordinary — so a reviewer without both definitions
  cannot distinguish this from a correct change. Retrieval-off runs are expected to miss
  it; that asymmetry is the point.

  repo-state is generated by generate-repo-state.py. Regenerate rather than hand-edit.
