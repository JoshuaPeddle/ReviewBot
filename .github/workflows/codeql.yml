name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Re-scan weekly so newly disclosed advisories show up even on quiet weeks.
    - cron: "32 4 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [csharp]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Build
        run: dotnet build --no-incremental -c Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  vulnerable-packages:
    name: Audit NuGet packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: List vulnerable packages
        run: |
          set -euo pipefail
          # Advisories we have consciously accepted are declared once, as
          # <NuGetAuditSuppress/> in Directory.Build.props (each needs a comment saying
          # why). `dotnet list package --vulnerable` does not honour those suppressions,
          # so apply them here too — otherwise an advisory with no upstream fix pins this
          # job red forever and it stops meaning anything.
          suppressed=$(grep -oE 'GHSA-[a-zA-Z0-9-]+' Directory.Build.props | sort -u || true)
          if [ -n "$suppressed" ]; then
            echo "Suppressed advisories (see Directory.Build.props):"
            echo "$suppressed" | sed 's/^/  /'
          fi

          output=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$output"

          remaining=$(echo "$output" | grep -E '^[[:space:]]+>' || true)
          for advisory in $suppressed; do
            remaining=$(echo "$remaining" | grep -v "$advisory" || true)
          done

          if [ -n "$(echo "$remaining" | tr -d '[:space:]')" ]; then
            echo "::error::Vulnerable NuGet packages detected (excluding suppressed advisories)."
            echo "$remaining"
            exit 1
          fi
          echo "No unsuppressed vulnerable packages."
